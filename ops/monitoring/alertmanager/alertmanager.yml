# ============================================================
# Alertmanager 配置文件
#
# 告警通知渠道：
#   当前配置了 Webhook（可对接钉钉/企微机器人）
#   如需邮件通知，取消 smtp_smarthost 相关注释
#
# 告警路由逻辑：
#   critical → 立即通知
#   warning  → 等待 5 分钟聚合后通知（减少噪音）
#   info     → 仅记录，不通知
# ============================================================

global:
  # 邮件配置（可选，取消注释启用）
  # smtp_smarthost: 'smtp.qq.com:465'
  # smtp_from: 'your-email@qq.com'
  # smtp_auth_username: 'your-email@qq.com'
  # smtp_auth_password: 'your-smtp-password'
  # smtp_require_tls: false

# 告警模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 告警路由
route:
  # 默认接收者
  receiver: 'default-webhook'
  # 分组策略：按 alertname 分组
  group_by: ['alertname', 'instance']
  # 初始等待时间：30 秒内相同分组的告警合并
  group_wait: 30s
  # 同组告警发送间隔：5 分钟
  group_interval: 5m
  # 重复通知间隔：4 小时
  repeat_interval: 4h

  routes:
    # critical 级别：立即通知，更短的重复间隔
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 10s
      repeat_interval: 1h

    # warning 级别：正常聚合
    - match:
        severity: warning
      receiver: 'default-webhook'
      group_wait: 30s
      repeat_interval: 4h

# 接收者配置
receivers:
  # 默认 Webhook（可对接钉钉/企微机器人）
  - name: 'default-webhook'
    webhook_configs:
      # 钉钉机器人示例（取消注释并填入你的 Webhook URL）
      # - url: 'http://localhost:8060/dingtalk/ops/send'
      #   send_resolved: true
      #   title: '{{ template "ding.title" . }}'
      #   text: '{{ template "ding.text" . }}'

      # 企微机器人示例
      # - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY'
      #   send_resolved: true

      # 默认：写入日志（用于调试）
      - url: 'http://localhost:9095/alert'  # 占位，实际无接收端
        send_resolved: true

  # Critical 级别接收者
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://localhost:9095/alert'  # 占位，实际无接收端
        send_resolved: true

  # 邮件接收者（可选）
  # - name: 'email-alerts'
  #   email_configs:
  #     - to: 'your-email@example.com'
  #       from: 'alertmanager@example.com'
  #       smarthost: 'smtp.qq.com:465'
  #       auth_username: 'your-email@qq.com'
  #       auth_password: 'your-smtp-password'

# 抑制规则：critical 告警触发时，抑制同名的 warning 告警
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
