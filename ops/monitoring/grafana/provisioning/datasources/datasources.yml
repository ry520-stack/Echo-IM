# ============================================================
# Grafana 数据源自动配置
#
# 为什么用 provisioning：启动时自动配置数据源，无需手动添加
# 支持的数据源：
#   1. Prometheus - 指标数据
#   2. Loki - 日志数据
# ============================================================

apiVersion: 1

datasources:
  # Prometheus 数据源（指标）
  - name: Prometheus
    type: prometheus
    access: proxy                              # 通过 Grafana 后端代理访问
    url: http://prometheus:9091                # Docker 内部网络地址
    isDefault: true                            # 设为默认数据源
    editable: false
    jsonData:
      httpMethod: POST                         # POST 方式查询（支持大查询）
      timeInterval: '15s'                      # 与 Prometheus 采集间隔一致

  # Loki 数据源（日志）
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000                           # 单次查询最大行数
