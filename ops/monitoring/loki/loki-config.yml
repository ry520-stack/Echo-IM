# ============================================================
# Loki 配置文件
#
# Loki 是 Grafana 出品的日志聚合系统
# 类似 Prometheus 但专门处理日志（非指标）
#
# 存储策略：
#   使用本地文件系统（适合小规模部署）
#   生产环境建议用 S3/MinIO 对象存储
# ============================================================

auth_enabled: false    # 单机模式不需要多租户认证

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info      # 生产用 info，调试改 debug

# 通用配置
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# 查询引擎配置
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100    # 查询结果缓存 100MB

# Schema 配置（定义日志索引方式）
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h        # 每天一个索引文件

# 存储配置
storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# 限制配置（适配小机器）
limits_config:
  retention_period: 168h          # 日志保留 7 天
  max_query_length: 721h          # 最大查询范围 30 天
  max_query_parallelism: 4        # 查询并行度
  max_entries_limit_per_query: 5000  # 单次查询最大条数
  ingestion_rate_mb: 4            # 采集速率 4MB/s
  ingestion_burst_size_mb: 8      # 采集突发 8MB

# 压缩配置
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m        # 每 10 分钟压缩一次
  retention_enabled: true         # 启用数据保留策略
  retention_delete_delay: 2h      # 删除延迟 2 小时
  retention_delete_worker_count: 150
  delete_request_store: filesystem # 删除请求存储位置

# 分析配置
analytics:
  reporting_enabled: false         # 禁用 Grafana 遥测
