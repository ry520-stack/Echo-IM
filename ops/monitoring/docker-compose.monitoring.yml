# ============================================================
# Echo IM 监控平台 - Docker Compose
#
# 组件清单：
#   Prometheus   - 指标采集与存储（时序数据库）
#   Grafana      - 可视化仪表盘
#   Alertmanager - 告警路由与通知
#   Node Exporter- Linux 主机指标采集
#   cAdvisor     - Docker 容器指标采集（可选，已禁用）
#   pg-exporter  - PostgreSQL 指标采集
#   Loki         - 日志聚合存储
#   Promtail     - 日志采集代理
#
# 端口分配（避开 Echo 业务端口 80/443/8080/9090/5433）：
#   Prometheus:    9091
#   Grafana:       3000
#   Alertmanager:  9093
#   Node Exporter: 9100
#   cAdvisor:      8085 (已禁用)
#   pg-exporter:   9187
#   Loki:          3100
#   Promtail:      9080
# ============================================================

services:
  # ──────────────────────────────────────────────
  # Prometheus - 时序数据库 + 指标采集引擎
  # 为什么用 Prometheus：云原生监控标准，Pull 模型，PromQL 强大
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: echo-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'        # 保留 15 天数据，适配小磁盘
      - '--web.enable-lifecycle'                     # 支持热重载配置
      - '--web.listen-address=:9091'                 # 避开 Echo backend 的 9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9091:9091'
    networks:
      - monitoring_net
      - echo_default                                 # 连接 Echo 网络，发现业务容器
    extra_hosts:
      - 'host.docker.internal:host-gateway'          # 访问宿主机服务

  # ──────────────────────────────────────────────
  # Grafana - 可视化仪表盘
  # 为什么用 Grafana：业界标准，支持 Prometheus/Loki 多数据源
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: echo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin                  # 默认管理员
      GF_SECURITY_ADMIN_PASSWORD: echo2026           # 首次登录后建议修改
      GF_USERS_ALLOW_SIGN_UP: 'false'                # 禁止自行注册
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans             # 默认中文界面
      GF_SERVER_ROOT_URL: 'http://localhost:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    networks:
      - monitoring_net
    depends_on:
      - prometheus

  # ──────────────────────────────────────────────
  # Node Exporter - Linux 主机指标采集
  # 采集 CPU、内存、磁盘、网络等内核级指标
  # ──────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: echo-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'                   # 挂载宿主机 /proc
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - '9100:9100'
    networks:
      - monitoring_net

  # ──────────────────────────────────────────────
  # cAdvisor - Docker 容器指标采集（可选）
  # 国内网络环境 gcr.io 镜像无法拉取，已禁用
  # 替代方案：Docker 原生指标 + Node Exporter 已覆盖容器基础监控
  # 如需启用，取消下方注释并确保镜像可用：
  #   cadvisor:
  #     image: gcr.io/cadvisor/cadvisor:v0.49.1
  #     ...
  # ──────────────────────────────────────────────
  # PostgreSQL Exporter - 数据库指标采集
  # 采集连接数、查询性能、表大小、缓存命中率等
  # ──────────────────────────────────────────────
  pg-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: echo-pg-exporter
    restart: unless-stopped
    environment:
      # 连接到 Echo 的 PostgreSQL（通过 echo_default 网络）
      DATA_SOURCE_NAME: 'postgresql://echo_user:echo_pass@echo-db-1:5432/echo_db?sslmode=disable'
    ports:
      - '9187:9187'
    networks:
      - monitoring_net
      - echo_default

  # ──────────────────────────────────────────────
  # Alertmanager - 告警路由与通知
  # 接收 Prometheus 告警，去重、分组、发送通知
  # ──────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: echo-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - '9093:9093'
    networks:
      - monitoring_net

  # ──────────────────────────────────────────────
  # Loki - 日志聚合存储（类似 Prometheus 但用于日志）
  # 轻量级，与 Grafana 深度集成
  # ──────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: echo-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'
    networks:
      - monitoring_net

  # ──────────────────────────────────────────────
  # Promtail - 日志采集代理
  # 采集 Nginx 日志、Docker 容器日志，推送到 Loki
  # ──────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: echo-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro                          # 宿主机系统日志
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # Docker 容器日志
      - /run/promtail:/run/promtail                   # positions 文件持久化
    ports:
      - '9080:9080'
    networks:
      - monitoring_net

# ============================================================
# 网络配置
# monitoring_net: 监控组件内部通信
# echo_default:   连接 Echo 业务容器（外部网络，已存在）
# ============================================================
networks:
  monitoring_net:
    driver: bridge
  echo_default:
    external: true                                    # 使用已有的 Echo Docker 网络

# ============================================================
# 数据卷
# 所有监控数据独立存储，删除容器不丢数据
# ============================================================
volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
