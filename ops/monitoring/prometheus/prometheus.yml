# ============================================================
# Prometheus 配置文件
#
# 采集目标：
#   1. Prometheus 自身（自监控）
#   2. Node Exporter（主机指标）
#   3. cAdvisor（容器指标，已禁用）
#   4. PostgreSQL Exporter（数据库指标）
#   5. Echo Backend（应用指标，如果有 /metrics 端点）
#   6. Alertmanager（告警器自监控）
#   7. Loki（日志系统自监控）
# ============================================================

global:
  scrape_interval: 15s         # 全局采集间隔 15 秒
  evaluation_interval: 15s     # 规则评估间隔 15 秒
  scrape_timeout: 10s          # 采集超时

# ============================================================
# 告警规则文件
# ============================================================
rule_files:
  - '/etc/prometheus/alert.rules.yml'

# ============================================================
# Alertmanager 配置
# 告警发送到哪里
# ============================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# ============================================================
# 采集目标配置
# ============================================================
scrape_configs:
  # ── Prometheus 自身监控 ──
  # 为什么：监控 Prometheus 自己的性能（采集延迟、存储大小等）
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091']

  # ── Linux 主机指标 ──
  # 采集 CPU、内存、磁盘、网络等系统级指标
  # 通过 Docker 内部 DNS 解析 node-exporter 容器名
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'echo-ecs'

  # ── Docker 容器指标（已禁用） ──
  # cAdvisor 镜像在国内无法拉取，已注释
  # 如需启用，取消下方注释并确保 cAdvisor 容器运行
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         instance: 'echo-ecs'

  # ── PostgreSQL 指标 ──
  # 采集数据库连接数、查询延迟、表大小、缓存命中率
  - job_name: 'postgresql'
    static_configs:
      - targets: ['pg-exporter:9187']
        labels:
          instance: 'echo-db'

  # ── Echo Backend 应用指标 ──
  # 如果 backend 暴露了 /metrics 端点，Prometheus 会自动采集
  # Express 应用通常需要集成 prom-client 库
  # 当前为预留配置，backend 未暴露 metrics 端点时会显示 DOWN（不影响其他采集）
  - job_name: 'echo-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['echo-backend-1:3001']
        labels:
          service: 'echo-backend'
    # 允许采集失败（backend 可能没有 /metrics 端点）
    scrape_interval: 30s

  # ── Nginx 指标（通过 stub_status） ──
  # Nginx 需要启用 stub_status 模块才能暴露指标
  # 配置方法：在 Nginx 配置中添加 location /nginx_status
  # 当前为预留配置
  - job_name: 'nginx'
    metrics_path: '/nginx_status'
    static_configs:
      - targets: ['host.docker.internal:80']
        labels:
          service: 'nginx'
    scrape_interval: 30s

  # ── Alertmanager 自监控 ──
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # ── Loki 自监控 ──
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
